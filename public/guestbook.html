<body data-page="guestbook">
<div class="wrap">
<div id="head"></div>
<div class="cols">
<main class="main" id="content"><h2>Guestbook</h2>
<p>Passing through? Leave a note, a question, or a favourite book recommendation.</p>
<form id="gbform" autocomplete="off">
<label for="gbn">Your name</label>
<input type="text" id="gbn" name="name" maxlength="60" required>
<label for="gbm">Your message</label>
<textarea id="gbm" name="message" maxlength="1000" style="min-height:120px" required></textarea>
<div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
<div class="btnrow"><button type="submit">Sign the Guestbook</button></div>
<p class="status-line" id="gbmsg" role="status"></p>
</form>
<hr class="orn">
<div id="gblist"></div></main>
<aside class="side" id="side"></aside>
</div>
<div id="foot"></div>
</div>
<script src="js/store.js" data-base=""></script>
<script src="js/site.js"></script>
